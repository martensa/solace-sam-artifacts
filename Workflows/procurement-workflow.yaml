log:
  stdout_log_level: INFO
  log_file_level: DEBUG
  log_file: procurement_article_research.log

apps:
  - name: procurement_article_research_app
    app_base_path: .
    app_module: solace_agent_mesh.workflow.app
    broker:
      dev_mode: ${SOLACE_DEV_MODE, false}
      broker_url: ${SOLACE_BROKER_URL, ws://localhost:8080}
      broker_username: ${SOLACE_BROKER_USERNAME, default}
      broker_password: ${SOLACE_BROKER_PASSWORD, default}
      broker_vpn: ${SOLACE_BROKER_VPN, default}
      temporary_queue: ${USE_TEMPORARY_QUEUES, true}
    app_config:
      namespace: ${NAMESPACE}
      name: "ProcurementArticleResearch"
      agent_name: "ProcurementArticleResearch"
      display_name: "Procurement Article Research"
      supports_streaming: true

      model:
        model: "${LLM_SERVICE_GENERAL_MODEL_NAME}"
        api_base: "${LLM_SERVICE_ENDPOINT}"
        api_key: "${LLM_SERVICE_API_KEY}"

      # Wall-clock cap. Realistic for 100 items: ~18-20 min wall-clock
      # given Phase-3 image search (~225 s for 50 items at conc=6) plus
      # Phase-4 sequential price chunks (~110 s each, 4 chunks for 100
      # items). 1800 s = 30 min keeps us well clear of pathological runs.
      max_workflow_execution_time_seconds: 1800
      default_node_timeout_seconds: 60
      # No item-cap below 100; the workflow chunks internally for the
      # price phase. Users with >100 items should split into sessions.
      default_max_map_items: 100

      workflow:
        description: >
          Procurement Article Research: takes a list of article codes /
          names / SKUs and produces a structured procurement brief per
          item (verified product name + manufacturer + EAN + technical
          description + product image + market-price comparison +
          source links + status). Sequential pipeline: verify ->
          ean -> image -> price -> report. Auto-detects B2B
          net-price markers (Nettoartikel / BRUTTOARTIKEL / NLAG)
          and skips public-pricing for those positions while still
          gathering image + EAN for internal documentation.
        version: "1.0.0"

        fail_fast: false
        max_call_depth: 15

        input_schema:
          type: object
          properties:
            articles:
              type: string
              description: "Article list, one item per line."
          required: [articles]

        nodes:
          # ================================================================
          # PHASE 0 -- parse_articles
          # Pure text -> JSON array. No web search. Auto-detects net-price
          # markers in each line.
          # ================================================================
          - id: parse_articles
            type: agent
            agent_name: "WebResearchAgent"
            input:
              message: |
                Parse this article list into a JSON array. Each non-empty
                line is one article. Return ONLY a valid JSON array, no
                markdown fences, no prose.

                Format: [{"position": <1-based-int>, "raw_code": "<full line as-is>", "is_b2b_netto": <bool>}]

                Set is_b2b_netto=true if the line contains any of:
                Nettoartikel, Nettoangebotspreise, Nettoangebotsartikel,
                BRUTTOARTIKEL, NLAG.

                Skip empty lines. Number positions starting at 1.

                Articles:
                {{workflow.input.articles}}
            instruction: >
              Do NOT use any web search tools. Pure JSON-formatting task.
              Save the JSON array as an artifact and end with the result embed.
            timeout: "30s"

          # ================================================================
          # PHASE 1 -- verify_articles (ArticleVerificationAgent)
          # Per item: 1 web search to identify product_name, manufacturer,
          # article_number, category, ean_hint (if surfaced), short_description,
          # confidence. AVA's built-in pre-filter catches net-price markers
          # automatically and short-circuits without consuming a web search.
          # ================================================================
          - id: verify_single
            type: agent
            agent_name: "ArticleVerificationAgent"
            input:
              message: "{{_map_item.raw_code}}"
            instruction: |
              Use check_article first. If the pre-filter flags a pricing
              label (Nettoartikel / BRUTTOARTIKEL / NLAG), return immediately
              with a skip indicator and stop -- do NOT call search_article.

              Otherwise call search_article exactly once with the article
              code or name from the input. From the search results extract:
                - product_name      full official name
                - manufacturer      brand
                - article_number    manufacturer SKU when visible
                - category          one of: industrial_mro, electronics,
                                    tools_hardware, sanitary, fashion_apparel,
                                    book_media, food_beverage, automotive,
                                    chemicals_lab, cosmetic_pharma,
                                    office_supplies, sports_outdoor,
                                    home_garden, toys_hobby, default
                - ean_hint          GTIN-13 if surfaced in any snippet, else null
                - short_description max 150 chars, technical/feature-focused
                - confidence        high | medium | low | none

              Return ONLY this JSON (no markdown, no prose):
              {
                "position": {{_map_item.position}},
                "raw_code": "{{_map_item.raw_code}}",
                "is_b2b_netto": {{_map_item.is_b2b_netto}},
                "product_name": "...",
                "manufacturer": "...",
                "article_number": "...",
                "category": "...",
                "ean_hint": null | "...",
                "short_description": "...",
                "confidence": "..."
              }

              Save as artifact and end with the result embed.
            timeout: "30s"

          - id: verify_articles
            type: map
            depends_on: [parse_articles]
            items: "{{parse_articles.output}}"
            node: verify_single
            concurrency_limit: 6
            max_items: 100

          # ================================================================
          # PHASE 2 -- verify_eans (EANSearchAgent)
          # If the verify step surfaced an ean_hint, just verify it.
          # Otherwise search by product_name + manufacturer.
          # SKIP for B2B net-price items (no public EAN expected).
          # ================================================================
          - id: ean_single
            type: agent
            agent_name: "EANSearchAgent"
            input:
              message: |
                Item: {{_map_item}}

                If is_b2b_netto is true, respond with:
                  {"position": {{_map_item.position}}, "ean": null,
                   "ean_source": "skipped_b2b_netto", "raw": "<short reason>"}

                If ean_hint is non-null and is a 13-digit number, call
                ean_validation to verify the checksum + GS1 prefix; on
                success return {"...", "ean": "<ean_hint>", "ean_source": "verified"}.

                Otherwise call ean_product_search ONCE with
                "{{_map_item.manufacturer}} {{_map_item.product_name}}".
                Return the best matching EAN, or null when nothing found.
            instruction: >
              Make at most 1 paid lookup tool call. Return ONLY a JSON
              object with position, ean (string|null), ean_source
              (verified|found|not_found|skipped_b2b_netto), and a short
              raw note. Save as artifact and end with the result embed.
            timeout: "30s"

          - id: verify_eans
            type: map
            depends_on: [verify_articles]
            items: "{{verify_articles.output.results}}"
            node: ean_single
            concurrency_limit: 6
            max_items: 100

          # ================================================================
          # PHASE 3 -- search_images (WebScraperAgent)
          # Uses verified EAN (preferred) or product_name + manufacturer.
          # Runs for ALL items, including B2B net-price -- product images
          # are still useful for internal procurement documentation.
          # ================================================================
          - id: image_single
            type: agent
            agent_name: "WebScraperAgent"
            input:
              message: |
                Find a product image for this article.

                Item: {{_map_item}}

                Use search_and_download_image with response_mode=summary.
                Query priority:
                  1. ean (if available)
                  2. "{{_map_item.manufacturer}} {{_map_item.product_name}}"
            instruction: >
              Use search_and_download_image exactly once. Do NOT use
              screenshot_webpage or fetch_webpage. One image per item is
              sufficient. If the call fails or no image is found, respond
              with {"position": ..., "image_artifact_ref": null,
              "note": "no image"}. Save as artifact, end with result embed.
            timeout: "30s"

          - id: search_images
            type: map
            depends_on: [verify_eans]
            items: "{{verify_eans.output.results}}"
            node: image_single
            concurrency_limit: 6
            max_items: 100

          # ================================================================
          # PHASE 4a -- chunk_for_prices
          # Pure JSON transformation: split the items array into chunks of
          # max 25 (PriceComparisonAgent's batch_search_prices limit).
          # No web search. Preserves item order.
          # ================================================================
          - id: chunk_for_prices
            type: agent
            depends_on: [verify_eans]
            agent_name: "WebResearchAgent"
            input:
              message: |
                Split this items array into chunks of at most 25 items each.
                Return ONLY a JSON array of arrays (no markdown). Preserve
                order. Each inner array contains the item objects unchanged.

                Items:
                {{verify_eans.output.results}}
            instruction: >
              Do NOT use any web search tools. Pure JSON manipulation.
              Save as a JSON artifact and end with the result embed.
            timeout: "20s"

          # ================================================================
          # PHASE 4b -- search_prices_in_chunk (PriceComparisonAgent batch)
          # ONE batch_search_prices call per chunk. Skips B2B net-price
          # items inside the chunk payload. Uses ean as query when
          # available (more precise), else manufacturer + product_name.
          #
          # Sequential (concurrency_limit: 1): the PCA pod has a per-domain
          # concurrency cap on aggregators (Idealo/Geizhals=1) and runs
          # better with one batch at a time than 4 batches concurrent.
          # ================================================================
          - id: search_prices_in_chunk
            type: agent
            agent_name: "PriceComparisonAgent"
            input:
              message: |
                Call batch_search_prices with fetch_details=true on this
                chunk of items.

                For each item in the chunk:
                  - position is the procurement-list line number
                  - SKIP items where is_b2b_netto is true (do not include
                    them in the items[] payload)
                  - For non-skipped items:
                      query = ean (when present and ean_source is verified
                              or found)
                      else  = "{{this.manufacturer}} {{this.product_name}}"
                      label = "Pos {{this.position}}"
                      quantity = 1

                Return ONLY the batch_search_prices JSON result.

                Chunk:
                {{_map_item}}
            instruction: >
              Make exactly one batch_search_prices call.
              Skip the search for items with is_b2b_netto=true and instead
              add a synthetic per-item entry like {"position": ...,
              "status": "skipped_b2b_netto", "note": "Nettoartikel --
              kein oeffentlicher Preis"} to the items array of the
              returned JSON, so the final report still has 1 entry per
              position. Save the result as an artifact and end with
              the result embed.
            timeout: "180s"

          - id: search_prices
            type: map
            depends_on: [chunk_for_prices]
            items: "{{chunk_for_prices.output}}"
            node: search_prices_in_chunk
            concurrency_limit: 1
            max_items: 5

          # ================================================================
          # PHASE 5 -- compile_report
          # Pure markdown generation. No web search. Joins data from all
          # prior phases on `position` and emits a procurement brief.
          # ================================================================
          - id: compile_report
            type: agent
            depends_on: [verify_articles, verify_eans, search_images, search_prices]
            agent_name: "WebResearchAgent"
            input:
              message: |
                Build a German Markdown procurement brief that joins these
                data sources on the `position` field.

                Sources:
                  - Verified articles: {{verify_articles.output.results}}
                  - EAN lookups:       {{verify_eans.output.results}}
                  - Product images:    {{search_images.output.results}}
                  - Price comparison:  {{search_prices.output.results}}

                Output structure:

                  ## Procurement Article Research -- Bericht

                  ### Zusammenfassung
                  - Gesamt: <N> Positionen
                  - Erfolgreich: <X> mit Preis und EAN
                  - Nettoartikel: <Y> (Preis nicht oeffentlich)
                  - Fehlgeschlagen: <Z>

                  ### Positionen

                  Pro Position eine Tabelle:

                  | Feld | Wert |
                  |------|------|
                  | Position | <pos> |
                  | Bezeichnung | <product_name> |
                  | Hersteller | <manufacturer> |
                  | Artikelnummer | <article_number> |
                  | Kategorie | <category> |
                  | EAN | <ean> (Quelle: verified/found/not_found/skipped) |
                  | Beschreibung | <short_description> |
                  | Bild | <image_artifact_ref or "nicht verfuegbar"> |
                  | Bester Preis | <cheapest.total_price> EUR bei <cheapest.merchant> |
                  | Spread | min/median/max EUR |
                  | URL | <cheapest.url> |
                  | Status | success / partial / no_results / skipped_b2b_netto / failed |

                  Wenn Status no_results UND PriceComparisonAgent
                  next_actions zurueckgeliefert hat:
                    Naechste Schritte: <bullet list aus next_actions>

                  ### Fehlgeschlagene Positionen
                  Falls Z > 0: Liste mit raw_code und Grund.

                Sortiere nach Position aufsteigend. Verwende deutsche
                Zahlenformat ("1.234,56 EUR"). Markiere Outlier mit
                Warnung.
            instruction: >
              Do NOT use any web search tools. Pure Markdown compilation.
              Include EVERY position even when partial. Use load_artifact
              if any of the source references resolve to an artifact ID
              instead of inline JSON. Save the final Markdown as an
              artifact and end with the result embed.
            timeout: "120s"

        output_mapping:
          report: "{{compile_report.output}}"

      agent_card:
        description: >
          Procurement Article Research workflow. Takes a free-form list
          of article codes / SKUs / product names (one per line) and
          produces a structured procurement brief per item: verified
          product name + manufacturer + article number + category + EAN
          + short technical description + product image + market-price
          comparison + source links + status. Sequential pipeline:
          verify (ArticleVerificationAgent) -> ean (EANSearchAgent) ->
          image (WebScraperAgent) -> price (PriceComparisonAgent batch)
          -> Markdown report. Auto-detects B2B net-price markers
          (Nettoartikel / BRUTTOARTIKEL / NLAG) and skips public pricing
          for those positions while still gathering image and EAN data
          for internal documentation. Handles up to 100 items per
          request; chunks the price-comparison phase internally into
          25-item batches.
        defaultInputModes: ["text"]
        defaultOutputModes: ["text", "file"]
        skills:
          - id: "procurement_article_research"
            name: "Procurement Article Research"
            description: >
              End-to-end research per article position: verifies product
              identity, finds and validates EAN, fetches a product image,
              compares market prices, and emits a single Markdown brief
              with all sources and status flags.
          - id: "procurement_article_verification"
            name: "Article Verification"
            description: >
              Resolves incomplete article descriptions, manufacturer
              SKUs and order numbers to a verified product name +
              manufacturer + category via web search. Auto-detects
              B2B net-price markers.
          - id: "procurement_market_price_comparison"
            name: "Market Price Comparison"
            description: >
              Compares public market prices across 100+ German retail
              and B2B portals via the PriceComparisonAgent. Supports
              quantity-aware bulk pricing (Staffelpreis) and outlier
              detection. Chunks into 25-item batches when needed.

      agent_card_publishing:
        interval_seconds: 10
      agent_discovery:
        enabled: true
      inter_agent_communication:
        # The workflow needs to invoke all four downstream agents.
        allow_list:
          - "WebResearchAgent"
          - "ArticleVerificationAgent"
          - "EANSearchAgent"
          - "WebScraperAgent"
          - "PriceComparisonAgent"
        request_timeout_seconds: 180

      session_service:
        type: ${PERSISTENCE_TYPE, sql}
        database_url: ${DATABASE_URL, sqlite:///procurement_article_research.db}
        default_behavior: PERSISTENT

      artifact_service:
        type: ${ARTIFACT_SERVICE_TYPE, s3}
        bucket_name: ${S3_BUCKET_NAME}
        endpoint_url: ${S3_ENDPOINT_URL}
        aws_region: ${AWS_REGION, us-east-1}
        artifact_scope: namespace

      artifact_handling_mode: reference
      enable_embed_resolution: true
      enable_artifact_content_instruction: true
