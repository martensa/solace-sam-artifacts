apiVersion: apps/v1
kind: Deployment
metadata:
  name: sam-procurement-workflow
  namespace: sam-solace-lab-workflows
  labels:
    app: sam-procurement-workflow
    tier: workflows
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sam-procurement-workflow
  template:
    metadata:
      labels:
        app: sam-procurement-workflow
        tier: workflows
        component: procurement-article-research
    spec:
      containers:
        - name: procurement-workflow
          image: registry.solace.lab/solace-agent-mesh-enterprise:1.97.2
          imagePullPolicy: Always
          command: ["solace-agent-mesh", "run"]
          args:
            - "configs/workflows/procurement_workflow.yaml"
          envFrom:
            # Shared values (LLM, Solace, S3); workflow-specific secret overrides
            - secretRef:
                name: sam-shared-secret
            - secretRef:
                name: sam-procurement-workflow-secret
          volumeMounts:
            - name: config-volume
              mountPath: /app/configs
            # Python sitecustomize.py auto-loaded at interpreter startup.
            # Patches SAM 1.97 agent_caller._generate_result_embed_reminder
            # to remove the misleading 'analysis_results.json' example
            # filename that downstream LLMs occasionally copy verbatim.
            # See ConfigMap sam-source-patches for details.
            - name: sam-patches
              mountPath: /opt/venv/lib/python3.13/site-packages/sitecustomize.py
              subPath: sitecustomize.py
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1536Mi"
              cpu: "1"
      volumes:
        - name: config-volume
          configMap:
            name: sam-procurement-workflow-config
            items:
              - key: procurement_workflow.yaml
                path: workflows/procurement_workflow.yaml
        - name: sam-patches
          configMap:
            name: sam-source-patches
            items:
              - key: sitecustomize.py
                path: sitecustomize.py
      imagePullSecrets:
        - name: localhost-registry
