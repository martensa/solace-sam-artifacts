apiVersion: apps/v1
kind: Deployment
metadata:
  name: sam-ean-search-agent
  namespace: sam-solace-lab-agents
  labels:
    app: sam-ean-search-agent
    tier: external-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sam-ean-search-agent
  template:
    metadata:
      labels:
        app: sam-ean-search-agent
        tier: external-agents
        component: ean-search
    spec:
      containers:
        - name: sam-ean-search-agent
          image: registry.solace.lab/sam-ean-search-agent:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          workingDir: /app
          command: ["solace-agent-mesh", "run"]
          args:
            - "configs/agents/ean_search_agent.yaml"
          envFrom:
            # Shared values (LLM, Solace, S3); agent-specific secret overrides
            - secretRef:
                name: sam-shared-secret
            - secretRef:
                name: sam-ean-search-agent-secret
          volumeMounts:
            - name: config-volume
              mountPath: /app/configs
      volumes:
        - name: config-volume
          configMap:
            name: sam-ean-search-agent-config
            items:
              - key: ean_search_agent.yaml
                path: agents/ean_search_agent.yaml
      imagePullSecrets:
        - name: localhost-registry
