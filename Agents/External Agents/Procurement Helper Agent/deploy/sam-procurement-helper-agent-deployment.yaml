apiVersion: apps/v1
kind: Deployment
metadata:
  name: sam-procurement-helper-agent
  namespace: sam-solace-lab-agents
  labels:
    app: sam-procurement-helper-agent
    tier: external-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sam-procurement-helper-agent
  template:
    metadata:
      labels:
        app: sam-procurement-helper-agent
        tier: external-agents
        component: procurement-helper
    spec:
      containers:
        - name: sam-procurement-helper-agent
          image: registry.solace.lab/sam-procurement-helper-agent:1.2.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          workingDir: /app
          command: ["solace-agent-mesh", "run"]
          args:
            - "configs/agents/procurement_helper_agent.yaml"
          envFrom:
            # Shared values (LLM, Solace, S3); agent-specific secret overrides
            - secretRef:
                name: sam-shared-secret
            - secretRef:
                name: sam-procurement-helper-agent-secret
          resources:
            # Pure-Python tools, no Playwright, no heavy CPU. Modest sizing.
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          volumeMounts:
            - name: config-volume
              mountPath: /app/configs
      volumes:
        - name: config-volume
          configMap:
            name: sam-procurement-helper-agent-config
            items:
              - key: procurement_helper_agent.yaml
                path: agents/procurement_helper_agent.yaml
      imagePullSecrets:
        - name: localhost-registry
