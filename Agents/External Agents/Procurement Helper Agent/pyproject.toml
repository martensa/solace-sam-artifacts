[project]
name = "procurement-helper-mcp"
version = "1.1.4"
description = "Deterministic helper tools for the Procurement Article Research workflow"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
