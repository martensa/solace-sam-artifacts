# =============================================================================
# industrial_mro.yaml -- Industry / MRO spare parts / tools / electrical.
# Parent category for: tools_hardware, electronics
# =============================================================================
key: industrial_mro
display_name: "Industrie / MRO"
inherits: default

domain_scores:
  # B2B-native distributors not in the base _PRICE_SITE_SCORES tier.
  # Safe to promote because these are authoritative industrial portals.
  wuerth.de: 85
  hoffmann-group.com: 85
  simply-mro.com: 72
  misumi.de: 78
  mercateo.com: 82
  sonepar.de: 80
  rexel.de: 80
  eibmarkt.com: 70
  voltus.de: 72
  cae.de: 70
  # v1.0.0 final quality push: B2B / sanitary / HVAC distributors that
  # produced real hits in Testlauf 1+2 but scored too low to reach the
  # fetch stage, plus clearly-missing open B2B marketplaces.
  automation24.de: 82         # Siemens/Festo automation, open prices
  ltec24.de: 70               # electrical wholesale, open
  elektro-wandelt.com: 70     # electrical, open prices
  schuricht.com: 75           # B2B electrical
  ksr-shop.de: 78             # Oppermann Rauchmelder hit (Testlauf 2 Pos 12)
  badshop-web.de: 76          # Oventrop Hydrocontrol hit (Testlauf 2 Pos 15)
  msr24.de: 72                # Oppermann alternate merchant (Testlauf 2)

manufacturer_domains:
  # Extend the base manufacturer list with industrial brands that publish
  # catalogues/datasheets but rarely prices. Adding them to the deprioritisation
  # zone avoids wasting Playwright slots on no-price pages.
  - bosch-professional.com
  - fluke.com
  - obo-bettermann.com
  - niedax.de
  - hilti.com
  - makita.de
  - metabo.com
  - dewalt.com
  - milwaukeetool.de

query_expansions:
  - "{q} Artikelnummer Preis"
  - "{q} Datenblatt"
  - '"{q}"'

rule_c_fillers:
  # Technical 3-4 char abbreviations common in industrial URLs that are
  # NOT variant suffixes -- guards Rule C against false positives.
  - cat   # CAT 6A / CAT 7 network class
  - rj    # RJ45 plug type
  - kat   # Kategorie (DE)
  - iec
  - din
  - vde
  - nyy   # cable designators
  - nym
  - ip   # ingress protection
  - led

price_band: [0.10, 200000.0]

# Phase I: catch B2B SKU mismatches such as Testlauf-3 Pos 3 / Pos 4
# where the brand was correct but the model token differed
# (KSA-S40 query landing on 1594-22-G). The detector is conservative
# -- it only fires when the query carries a part-number-shaped token
# (length>=4, alphanumeric mix, internal punctuation tolerated) AND
# that token is absent from URL path / breadcrumb / page title.
variant_detectors:
  - manufacturer_part_number
