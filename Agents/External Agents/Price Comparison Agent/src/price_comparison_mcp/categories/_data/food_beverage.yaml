# =============================================================================
# food_beverage.yaml -- Food, beverages, spirits, wine, dietary products
# =============================================================================
key: food_beverage
display_name: "Lebensmittel / Getraenke"
inherits: default

domain_scores:
  rewe.de: 85
  edeka24.de: 80
  metro.de: 80
  selgros.de: 75
  delinero.de: 72
  mueller.de: 72
  vinatis.de: 78              # wine
  wein-plus.eu: 72
  belvini.de: 68
  mytime.de: 70
  amazon-fresh.de: 68
  kaufland.de: 75
  lidl.de: 72
  flink.com: 68
  gorillas.io: 60

query_expansions:
  - "{q} kaufen"
  - "{q} Angebot"
  - "{q} Flasche"              # Helpful for wine/spirits

rule_c_fillers:
  # Ingredient / dietary vocab
  - bio
  - eco
  - veg
  - vgn                        # vegan abbrev
  - pur
  - new
  - neu

variant_detectors:
  - wine_vintage

# Tier-1.5 (post-TL6): Premier Grand Cru bottles routinely sit in the
# 800-3000 EUR range for legendary vintages (Margaux 2015, Lafite 2010).
# The previous 2000 EUR ceiling outlier-flagged legitimate offers; the
# new 5000 EUR ceiling lets the LLM validator + the Margaux-specific
# title check decide rather than a hard numeric gate. Hard floor stays
# at 0.50 EUR -- anything cheaper is reliably wrong (Margaux at 17.90
# EUR was a clear false positive in TL6).
price_band: [0.50, 5000.0]
