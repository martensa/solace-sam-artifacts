apiVersion: v1
kind: Secret
metadata:
  namespace: sam-solace-lab-agents
  name: sam-price-comparison-agent-secret
type: Opaque
stringData:
  # Must match your cluster / existing agent envs
  NAMESPACE: "sam-solace-lab"

  # ---------------------------------------------------------------------------
  # Artifact storage (S3-compatible)
  # ---------------------------------------------------------------------------
  S3_BUCKET_NAME: "sam-solace-lab"
  S3_ENDPOINT_URL: "http://agent-mesh-seaweedfs-0.agent-mesh-seaweedfs.sam-solace-lab.svc.cluster.local:8333"
  AWS_ACCESS_KEY_ID: "sam-solace-lab"
  AWS_SECRET_ACCESS_KEY: "sam-solace-lab"
  AWS_REGION: "us-east-1"

  # ---------------------------------------------------------------------------
  # LLM configuration
  # ---------------------------------------------------------------------------
  LLM_SERVICE_ENDPOINT: "https://lite-llm.mymaas.net"
  LLM_SERVICE_API_KEY: "sk-cFW9MYGP60mUCvQI6TzMrQ"
  LLM_SERVICE_GENERAL_MODEL_NAME: "openai/claude-sonnet-4-6"

  ENABLE_EMBED_RESOLUTION: "true"
  ENABLE_ARTIFACT_CONTENT_INSTRUCTION: "true"

  # ---------------------------------------------------------------------------
  # Solace Event Broker
  # ---------------------------------------------------------------------------
  SOLACE_BROKER_URL: "ws://host.docker.internal:8008"
  SOLACE_BROKER_VPN: "sam"
  SOLACE_BROKER_USERNAME: "default"
  SOLACE_BROKER_PASSWORD: "default"
  SOLACE_DEV_MODE: "false"

  # ---------------------------------------------------------------------------
  # Price Comparison MCP settings
  # ---------------------------------------------------------------------------

  # SearXNG meta-search engine (cluster-internal)
  PRICE_SEARXNG_URL: "http://searxng.sam-solace-lab.svc.cluster.local:8080"

  # SerpAPI key for structured Google Shopping results (optional).
  # Leave empty to disable SerpAPI. Obtain a key at https://serpapi.com.
  PRICE_SERPAPI_KEY: ""

  # Browser configuration for Playwright stealth mode
  WEB_SCRAPER_HEADLESS: "true"
  WEB_SCRAPER_PER_DOMAIN_DELAY_SECONDS: "1.0"
  WEB_SCRAPER_MAX_CONTEXTS: "5"
  WEB_SCRAPER_CONTEXT_IDLE_TIMEOUT: "120"
