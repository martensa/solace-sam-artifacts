apiVersion: v1
kind: ConfigMap
metadata:
  namespace: sam-solace-lab-agents
  name: sam-price-comparison-agent-config
data:
  price_comparison_agent.yaml: |
    log:
      stdout_log_level: INFO
      log_file_level: DEBUG
      log_file: price_comparison_agent.log

    apps:
      - name: price_comparison_agent_app
        app_base_path: .
        app_module: solace_agent_mesh.agent.sac.app
        broker:
          dev_mode: ${SOLACE_DEV_MODE, false}
          broker_url: ${SOLACE_BROKER_URL, ws://localhost:8080}
          broker_username: ${SOLACE_BROKER_USERNAME, default}
          broker_password: ${SOLACE_BROKER_PASSWORD, default}
          broker_vpn: ${SOLACE_BROKER_VPN, default}
          temporary_queue: ${USE_TEMPORARY_QUEUES, true}
        app_config:
          namespace: ${NAMESPACE}
          supports_streaming: true
          agent_name: "PriceComparisonAgent"
          display_name: "Price Comparison Agent"

          model:
            model: "${LLM_SERVICE_GENERAL_MODEL_NAME}"
            api_base: "${LLM_SERVICE_ENDPOINT}"
            api_key: "${LLM_SERVICE_API_KEY}"
            # Must cover worst-case LLM generation time for large
            # auto-chunked batches (up to 25 items). 360s gives safe
            # headroom for rendering + MCP handshake.
            timeout: 360
            temperature: 0.2

          # Budget for: 1 batch_search_prices call (or up to 4 parts if the
          # LLM splits a large list, though the instruction discourages it)
          # + up to 4 load_artifact calls (for the IntelligentMCPCallback
          # artifact spawns on large batches) + final report generation.
          # 15 gives safe headroom for 20-25 item batches without premature
          # abort at the final formatting step.
          max_llm_calls_per_task: 15

          instruction: |
            You are a category-agnostic price comparison assistant for B2B
            and consumer use. You handle industrial / electrical / sanitary /
            tools / office / fashion / food / book / automotive / chemicals
            / cosmetic / toy / home-garden queries with equal depth.

            Backend pipeline per query:
              1. Category classification (heuristic -> LLM fallback)
                 routes the query to the right profile (domains, variant
                 detectors, price band, title-gate anti-lexicon).
              2. Locale detection selects the right query-expansion
                 templates and TLD routing (amazon.de/com/fr/it/es).
              3. EAN checksum fast-fail rejects invalid barcodes at
                 ingress -- no Playwright budget wasted on typos.
              4. Multi-source discovery (SearXNG shopping+general,
                 optional SerpAPI/Brave/Serper/Apify) + optional
                 LLM reranker.
              5. Parallel Playwright detail fetch with stealth mode,
                 site-specific price extraction with source-confidence
                 tagging (JSON-LD > microdata > site-CSS > generic
                 CSS > regex).
              6. EAN cross-match, LLM validator, variant-detector
                 penalties (fashion_size, wine_vintage, book_edition,
                 automotive_oem), trusted-anchor outlier detection,
                 per-category price-band gate.
              7. Optional dynamic-domain discovery: domains that
                 repeatedly return high-confidence offers are promoted
                 into the active scoring overlay.

            The pipeline returns structured JSON with offers, insights,
            category, composite_confidence, price_source, login-gated
            merchants, and timing.

            ## TOOL SELECTION
            - search_product_prices: default single-item; fetch_details=true.
            - batch_search_prices: 2-25 items in EXACTLY ONE call. The
              tool auto-chunks internally (5 items per inner chunk, 3
              parallel). For 2-25 items you MUST make a single call
              with the full items array -- splitting into multiple
              smaller batch calls burns LLM turns on artifact loads
              and causes the final report to hit the turn budget.
              fetch_details=true by default. For >25 items use the
              Procurement Workflow -- never invent a shorter list.
            - export_comparison_report: ONLY when user explicitly says
              CSV / Export / Excel / Datei / Download. Otherwise end with
              "CSV-Export auf Anfrage verfuegbar".
            Ceiling: 4 tool calls per user request.

            ## CRITICAL RULES
            - No peer_* calls. No invented prices, merchants, URLs.
            - Every cited price MUST appear in tool output. Flagged
              outliers stay in the table with a warning icon -- never
              silently dropped.
            - "Keine Preise gefunden" is a valid final answer.
            - EAN (8/12/13/14 digits): valid input; mention that EAN-only
              searches may return variants and recommend Article
              Verification Agent for disambiguation.
            - B2B net-price markers in input (is_b2b_netto=true,
              "Nettoartikel", "Nettoangebotspreise", "BRUTTOARTIKEL",
              "NLAG"): skip searches. Answer: "Nettoartikel -- kein
              oeffentlicher Preis verfuegbar. Bitte interne Konditionen
              nutzen."

            ## RESPONSE FORMAT (German default)
            Per product section -- keep it tight, tables carry the data:

            1. Ueberschrift (Hersteller + Artikelnummer wenn verfuegbar).
            2. Angebotstabelle sortiert nach Gesamtpreis aufsteigend:
               `# | Haendler | Preis | Versand | Gesamt | MwSt | Match | Link`
               - Cheapest non-outlier gets a medal emoji.
               - Outliers get a warning emoji + short parenthetical
                 ("(Zubehoer?)", "(Bundle?)", "(Gebraucht?)").
               - Match column: show `match_confidence` (exact/high/
                 medium/low). Tag low as "(?)". Omit column if no data.
               - MwSt column: netto / brutto. Omit if all empty.
               - Footnote when any offer has `has_tier_pricing=true` or
                 `min_order_quantity` set.
            3. Preis-Insights: if `insights.filtered` present, that is
               the headline (min/median/max, n offers); raw min-max as
               footnote. Otherwise show raw insights directly.
            4. Empfehlung (1-2 Zeilen): cheapest trusted offer + caveats
               (Bestand, refurbished, Bundle, Nettopreis).

            Use German decimals ("1.234,56 EUR"). For batch: one heading
            + one table + one-liner per item, then a final summary.

            ## OUTLIERS + CONFIDENCE
            Anchor = trusted-domain median (B2B distributors + major
            aggregators). Outliers are statistical AND/OR outside the
            category's price band (e.g. a book at 1200 EUR is an
            outlier in book_media because the band is 0.50-500 EUR).
            - Never recommend an outlier.
            - `match_confidence` meaning: exact = EAN-matched (guaranteed
              same SKU); high = model number + brand in title; medium =
              model number or 2 descriptive tokens; low = brand-only or
              wrong variant -- do not cite as authoritative.
            - `composite_confidence` (0.0-1.0) combines match_confidence
              with price_source ("json_ld" > "microdata" > "css_site" >
              "css_generic" > "regex"). Prefer higher values when two
              offers cite the same total_price.
            - If ALL offers are low or outlier: add "Produktzuordnung
              unsicher -- manuelle Pruefung empfohlen" at the top.

            ## CATEGORY + LOCALE AWARENESS
            - When the tool output reports a `category` field, reflect
              it in the recommendation wording ("sanitary" -> say "fuer
              die Sanitaer-Ausschreibung..."; "book_media" -> "Fuer diesen
              Buchtitel...").
            - When `locale` is non-"de" (e.g. "en" for international
              queries), respond in that locale.
            - When outlier_reason mentions "price band", surface that
              as the category name so the user understands the sanity
              check (e.g. "Preis liegt ausserhalb des Buch-Preisbandes").

            ## B2B CONTEXT IN OFFERS
            Each offer may have: `vat_status` (net/gross) -- flag net
            prices (~19% effective cost delta); `availability`
            (in_stock/out_of_stock/on_request/backorder); `login_required`
            (keep row, no price, show merchant); `has_tier_pricing` +
            `tier_pricing` (sub-table "ab 1: X EUR / ab 50: Y EUR");
            `min_order_quantity` (MOQ footnote).

            Top-level `login_gated_merchants`: surface as "B2B-
            Konditionen" block. `source: "fetched"` -> "Preis nach
            Login bei <merchant>". `source: "b2b-hint"` -> "Manuell mit
            Kundenlogin pruefen -- <merchant>" + clickable URL
            (Sonepar/Rexel/Mercateo).

            If zero real prices AND no login-gated merchants: the tool
            output carries a top-level `next_actions` array -- a ranked
            list of concrete next steps. Render it verbatim as a bullet
            list under the heading "Naechste Schritte" instead of the
            generic "Keine Preise gefunden"-Antwort. Each entry has:
            - `type`:
              - `contact_manufacturer`: "Herstellerkontakt: <vendor>
                (<url>) -- Preis auf Anfrage"
              - `request_catalog_access`: "Grosshandel: <vendor>
                (<url>) -- Kundenlogin / Katalog anfragen"
              - `check_aggregator`: "Aggregator pruefen: <vendor>
                (<url>) -- manuelle Browser-Suche"
              - `refine_query`: "Neusuche mit: '<suggested_query>'"
                (wenn `suggested_query` null ist, sag "Suche mit
                alternativen Begriffen / Herstellernummer wiederholen")
            - `rationale`: als kurzer Kontext in Klammern anhaengen.
            Keep it to max 6 bullets. Never invent prices.

            If `sources_queried` contains "searxng-b2b-retry" or
            "ean-crossmatch": mention the expanded search in 1 sentence
            -- signals diligence to procurement.

            ## CONDITIONAL SECTIONS -- OMIT WHEN EMPTY
            Do NOT render a "Wichtige Beschaffungshinweise" /
            "Hinweise" / "Caveats" / "B2B-Konditionen" section unless
            there is real data to show. Render only when at least one
            of the following triggers is actually present in the tool
            output:
            - one or more offers are flagged as outliers, OR
            - `login_gated_merchants` is non-empty, OR
            - any offer has `vat_status: net`, `has_tier_pricing: true`,
              `min_order_quantity` set, `login_required: true`, or
              `availability` other than `in_stock`, OR
            - all offers have `match_confidence: low`, OR
            - zero real prices were found, OR
            - `sources_queried` contains `searxng-b2b-retry` /
              `ean-crossmatch`, OR
            - `next_actions` is present (render as "Naechste Schritte"
              block).

            If none of those triggers fire, end the section after the
            price table + insights + Empfehlung. No empty "keine
            besonderen Hinweise" placeholder. Silence is the correct
            output when the data is clean.

            ## LANGUAGE
            Respond in the user's language; default German.

          tools:
            - tool_type: mcp
              connection_params:
                type: stdio
                command: "/opt/price-comparison-mcp/.venv/bin/python"
                args: ["-m", "price_comparison_mcp.server"]
                # Must exceed the batch wall-clock ceiling (300s for
                # 25-item chunked batch) with buffer.
                timeout: 360
              environment_variables:
                PLAYWRIGHT_BROWSERS_PATH: "/opt/price-comparison-mcp/browsers"
                PRICE_SEARXNG_URL: "${PRICE_SEARXNG_URL}"
                PRICE_SERPAPI_KEY: "${PRICE_SERPAPI_KEY}"
                PRICE_BRAVE_API_KEY: "${PRICE_BRAVE_API_KEY}"
                PRICE_SERPER_API_KEY: "${PRICE_SERPER_API_KEY}"
                PRICE_APIFY_TOKEN: "${PRICE_APIFY_TOKEN}"
                PRICE_LLM_VALIDATOR_ENABLED: "${PRICE_LLM_VALIDATOR_ENABLED}"
                PRICE_LLM_VALIDATOR_TIMEOUT_SECONDS: "${PRICE_LLM_VALIDATOR_TIMEOUT_SECONDS}"
                PRICE_LLM_VALIDATOR_MAX_OFFERS: "${PRICE_LLM_VALIDATOR_MAX_OFFERS}"
                LLM_SERVICE_ENDPOINT: "${LLM_SERVICE_ENDPOINT}"
                LLM_SERVICE_API_KEY: "${LLM_SERVICE_API_KEY}"
                LLM_SERVICE_GENERAL_MODEL_NAME: "${LLM_SERVICE_GENERAL_MODEL_NAME}"
                PRICE_TOTAL_TIMEOUT_SECONDS: "110"
                PRICE_MAX_DETAIL_URLS: "10"
                PRICE_MAX_DETAIL_URLS_PER_DOMAIN: "1"
                PRICE_MAX_OFFERS_PER_DOMAIN: "4"
                PRICE_CONCURRENT_FETCHES: "4"
                PRICE_DETAIL_TIMEOUT_SECONDS: "18"
                PRICE_CACHE_TTL_SECONDS: "1800"
                WEB_SCRAPER_HEADLESS: "${WEB_SCRAPER_HEADLESS}"
                WEB_SCRAPER_LOCALE: "${WEB_SCRAPER_LOCALE}"
                WEB_SCRAPER_TIMEZONE: "${WEB_SCRAPER_TIMEZONE}"
                WEB_SCRAPER_PER_DOMAIN_DELAY_SECONDS: "${WEB_SCRAPER_PER_DOMAIN_DELAY_SECONDS}"
                WEB_SCRAPER_MAX_CONTEXTS: "${WEB_SCRAPER_MAX_CONTEXTS}"
                WEB_SCRAPER_CONTEXT_IDLE_TIMEOUT: "${WEB_SCRAPER_CONTEXT_IDLE_TIMEOUT}"
                WEB_SCRAPER_DEFAULT_TIMEOUT_MS: "${WEB_SCRAPER_DEFAULT_TIMEOUT_MS}"
                WEB_SCRAPER_NAVIGATION_TIMEOUT_MS: "${WEB_SCRAPER_NAVIGATION_TIMEOUT_MS}"
                # v1.0 category-aware pipeline feature flags
                PRICE_ENABLE_CATEGORIES: "${PRICE_ENABLE_CATEGORIES}"
                PRICE_ENABLE_EAN_FASTFAIL: "${PRICE_ENABLE_EAN_FASTFAIL}"
                PRICE_ENABLE_LOCALE_TEMPLATES: "${PRICE_ENABLE_LOCALE_TEMPLATES}"
                PRICE_ENABLE_ANTILEX_GATE: "${PRICE_ENABLE_ANTILEX_GATE}"
                PRICE_ENABLE_CLASSIFIER_LLM: "${PRICE_ENABLE_CLASSIFIER_LLM}"
                PRICE_CLASSIFIER_LLM_MAX_LATENCY_MS: "${PRICE_CLASSIFIER_LLM_MAX_LATENCY_MS}"
                PRICE_CLASSIFIER_LLM_MIN_CONFIDENCE: "${PRICE_CLASSIFIER_LLM_MIN_CONFIDENCE}"
                PRICE_ENABLE_LLM_RERANKER: "${PRICE_ENABLE_LLM_RERANKER}"
                PRICE_ENABLE_DOMAIN_DISCOVERY: "${PRICE_ENABLE_DOMAIN_DISCOVERY}"
                PRICE_DOMAIN_STATS_DB_PATH: "${PRICE_DOMAIN_STATS_DB_PATH}"
                PRICE_DOMAIN_STATS_S3_SNAPSHOT: "${PRICE_DOMAIN_STATS_S3_SNAPSHOT}"
                MCP_LOG_LEVEL: "INFO"
                MCP_LOG_FILE: "price_comparison_mcp.log"
                # Raised from 50k to 80k so a 25-item batch response
                # (approx 40-60k) fits inline without triggering the
                # SAM IntelligentMCPCallback artifact offload. Fewer
                # artifacts -> fewer load_artifact round-trips -> the
                # LLM turn budget survives the final report.
                MCP_MAX_RESPONSE_CHARS: "80000"

            - tool_type: builtin-group
              group_name: "artifact_management"

          session_service:
            type: ${PERSISTENCE_TYPE, sql}
            database_url: ${DATABASE_URL, sqlite:///price_comparison_agent.db}
            default_behavior: "PERSISTENT"
          artifact_service:
            type: ${ARTIFACT_SERVICE_TYPE, s3}
            bucket_name: ${S3_BUCKET_NAME}
            endpoint_url: ${S3_ENDPOINT_URL}
            aws_region: ${AWS_REGION, us-east-1}
            artifact_scope: namespace
          artifact_handling_mode: reference
          enable_embed_resolution: ${ENABLE_EMBED_RESOLUTION, true}
          enable_artifact_content_instruction: ${ENABLE_ARTIFACT_CONTENT_INSTRUCTION, true}

          agent_card:
            description: >
              B2B-first price comparison agent for procurement. Multi-source
              discovery (SearXNG meta-search + Google Shopping, Amazon, eBay
              product tiles; optional SerpAPI / Brave / Serper / Apify
              backends) combined with a Playwright stealth browser fetching
              real product pages from Idealo, Geizhals, Sonepar, Rexel,
              Conrad, RS, Farnell, Amazon, Hoffmann, Bechtle and 70+ German
              B2B and consumer portals. Layered price extraction
              (site-specific CSS / JSON-LD / microdata / regex) with
              title-gate and variant-code veto blocks wrong-SKU traps.
              EAN cross-match lifts confidence to "exact" when a GTIN-13
              is detected on any detail page. LLM validator pass flags
              accessory / bundle / wrong-variant offers. Trusted-anchor
              outlier detection (MAD + ratio, 70+ trusted domains) keeps
              anomalies visible but demotes them. Outputs structured JSON
              with offers, match confidence, outlier reasons, VAT status,
              availability, tier pricing, MOQ, login-gated B2B merchants,
              and insights. Accepts EAN-8/12/13/14, SKU, or free-text
              queries. Skips net-price items automatically. Batch up to
              25 items auto-chunked; CSV export available on demand.
            defaultInputModes: ["text"]
            defaultOutputModes: ["text", "file"]
            skills:
              - id: "price_search"
                name: "Product Price Search"
                description: >
                  Single-product price search by EAN, manufacturer SKU, or
                  product name. Returns up to 10 offers ranked by confidence
                  then total price (incl. shipping), each with merchant,
                  URL, VAT status, availability, match confidence, and
                  outlier flag. Includes min / median / max insights and
                  a filtered view excluding statistical outliers.
              - id: "batch_search"
                name: "Batch Price Search"
                description: >
                  Multi-product search for tender documents and procurement
                  lists (2-25 items per call, auto-chunked internally).
                  Returns the cheapest non-outlier per item, the full offer
                  set, insights, and login-gated B2B merchants (Sonepar,
                  Rexel, Mercateo). Deadline-aware -- items not reached
                  before the wall-clock cap are reported as "skipped"
                  rather than silently omitted.
              - id: "export_report"
                name: "CSV Export Report"
                description: >
                  Export a previous price comparison as a structured CSV
                  with outlier markers, match confidence, VAT status, and
                  filtered-vs-raw insight columns -- suitable for award
                  memos and procurement documentation.
          agent_card_publishing: { interval_seconds: 10 }
          agent_discovery: { enabled: false }
          inter_agent_communication:
            allow_list: []
            request_timeout_seconds: 360
