apiVersion: v1
kind: ConfigMap
metadata:
  namespace: sam-solace-lab-agents
  name: sam-price-comparison-agent-config
data:
  price_comparison_agent.yaml: |
    log:
      stdout_log_level: INFO
      log_file_level: DEBUG
      log_file: price_comparison_agent.log

    apps:
      - name: price_comparison_agent_app
        app_base_path: .
        app_module: solace_agent_mesh.agent.sac.app
        broker:
          dev_mode: ${SOLACE_DEV_MODE, false}
          broker_url: ${SOLACE_BROKER_URL, ws://localhost:8080}
          broker_username: ${SOLACE_BROKER_USERNAME, default}
          broker_password: ${SOLACE_BROKER_PASSWORD, default}
          broker_vpn: ${SOLACE_BROKER_VPN, default}
          temporary_queue: ${USE_TEMPORARY_QUEUES, true}
        app_config:
          namespace: ${NAMESPACE}
          supports_streaming: true
          agent_name: "PriceComparisonAgent"
          display_name: "Price Comparison Agent"

          model:
            model: "${LLM_SERVICE_GENERAL_MODEL_NAME}"
            api_base: "${LLM_SERVICE_ENDPOINT}"
            api_key: "${LLM_SERVICE_API_KEY}"
            timeout: 60
            temperature: 0.2

          max_llm_calls_per_task: 8

          instruction: |
            You are a price comparison assistant for procurement use cases.
            You search real-time market prices via SearXNG meta-search, optional
            Google Shopping (SerpAPI), and Playwright browser for detail page
            extraction.

            ## SPEED CONSTRAINT
            You have a 60-second budget per request. Make at most 3 tool calls.
            Return whatever you have after 3 calls -- partial results are fine.

            ## CRITICAL RULES
            - Do NOT call any peer agents (no peer_* calls).
            - NEVER invent prices, merchants, or links.
            - If no prices are found, say so clearly. Do not retry forever.
            - "No prices found" is a valid answer.

            ## INPUT DETECTION
            EAN: String of exactly 8, 12, 13, or 14 digits (strip spaces/hyphens).
            Product name/description: any other text.
            B2B net-price items (is_b2b_netto=true, "Nettoartikel",
            "Nettoangebotspreise"): skip ALL searches, respond immediately
            with "Nettoartikel -- kein oeffentlicher Preis verfuegbar."

            ## TOOL SELECTION
            - search_product_prices: Default for any single product price search.
              Use fetch_details=true for accurate prices (slower, up to 45s).
              Use fetch_details=false for quick estimates from search snippets (fast, 3-5s).
            - batch_search_prices: Multiple products at once. Uses fetch_details=false
              by default for speed. Good for tender documents / procurement lists.
            - export_comparison_report: CSV export of previous results.

            ## RESPONSE FORMAT
            - Sort by total price (price + shipping).
            - Highlight cheapest option.
            - Markdown table: Merchant | Price | Shipping | Total | Source | Link.
            - Include price insights (min/max/median) if available.
            - Keep text concise; let tables carry the data.

            ## LANGUAGE
            Respond in the user's language. Default: German.
            Price format: "XX,XX EUR" for German locale.

          tools:
            - tool_type: mcp
              connection_params:
                type: stdio
                command: "/opt/price-comparison-mcp/.venv/bin/python"
                args: ["-m", "price_comparison_mcp.server"]
                timeout: 60
              environment_variables:
                PLAYWRIGHT_BROWSERS_PATH: "/opt/price-comparison-mcp/browsers"
                PRICE_SEARXNG_URL: "${PRICE_SEARXNG_URL}"
                PRICE_SERPAPI_KEY: "${PRICE_SERPAPI_KEY}"
                PRICE_TOTAL_TIMEOUT_SECONDS: "55"
                PRICE_MAX_DETAIL_URLS: "5"
                PRICE_CONCURRENT_FETCHES: "3"
                PRICE_DETAIL_TIMEOUT_SECONDS: "15"
                PRICE_CACHE_TTL_SECONDS: "300"
                WEB_SCRAPER_HEADLESS: "${WEB_SCRAPER_HEADLESS}"
                WEB_SCRAPER_PER_DOMAIN_DELAY_SECONDS: "${WEB_SCRAPER_PER_DOMAIN_DELAY_SECONDS}"
                WEB_SCRAPER_MAX_CONTEXTS: "${WEB_SCRAPER_MAX_CONTEXTS}"
                WEB_SCRAPER_CONTEXT_IDLE_TIMEOUT: "${WEB_SCRAPER_CONTEXT_IDLE_TIMEOUT}"
                MCP_LOG_LEVEL: "INFO"
                MCP_LOG_FILE: "price_comparison_mcp.log"
                MCP_MAX_RESPONSE_CHARS: "50000"

            - tool_type: builtin-group
              group_name: "artifact_management"

          session_service:
            type: ${PERSISTENCE_TYPE, sql}
            database_url: ${DATABASE_URL, sqlite:///price_comparison_agent.db}
            default_behavior: "PERSISTENT"
          artifact_service:
            type: ${ARTIFACT_SERVICE_TYPE, s3}
            bucket_name: ${S3_BUCKET_NAME}
            endpoint_url: ${S3_ENDPOINT_URL}
            aws_region: ${AWS_REGION, us-east-1}
            artifact_scope: namespace
          artifact_handling_mode: reference
          enable_embed_resolution: ${ENABLE_EMBED_RESOLUTION, true}
          enable_artifact_content_instruction: ${ENABLE_ARTIFACT_CONTENT_INSTRUCTION, true}

          agent_card:
            description: >
              Professional price comparison for procurement use cases.
              Real-time price search via SearXNG meta-search (Google, Bing,
              DuckDuckGo) and optional Google Shopping (SerpAPI). Fetches
              detail pages via headless browser with stealth mode for accurate
              pricing from Idealo, Geizhals, Amazon, and other German retailers.
              Accepts EAN barcodes, product names, or free-text descriptions.
              Returns sorted offers with shipping costs, price insights
              (min/max/median), batch search for tender documents, and CSV export.
              Detects B2B net-price items and skips price search for those.
            defaultInputModes: ["text"]
            defaultOutputModes: ["text", "file"]
            skills:
              - id: "price_search"
                name: "Product Price Search"
                description: >
                  Search current prices for a product by EAN barcode or product
                  name. Returns offers sorted by total price including shipping,
                  with direct links and price insights.
              - id: "batch_search"
                name: "Batch Price Search"
                description: >
                  Search multiple products simultaneously for tender documents
                  and procurement lists. Returns total cost overview with
                  cheapest options per item.
              - id: "export_report"
                name: "CSV Export Report"
                description: >
                  Export a price comparison as a structured CSV report for
                  award memos and procurement documentation.
          agent_card_publishing: { interval_seconds: 10 }
          agent_discovery: { enabled: false }
          inter_agent_communication:
            allow_list: []
            request_timeout_seconds: 60
