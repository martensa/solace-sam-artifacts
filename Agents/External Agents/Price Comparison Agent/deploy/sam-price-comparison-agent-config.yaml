apiVersion: v1
kind: ConfigMap
metadata:
  namespace: sam-solace-lab-agents
  name: sam-price-comparison-agent-config
data:
  price_comparison_agent.yaml: |
    log:
      stdout_log_level: INFO
      log_file_level: DEBUG
      log_file: price_comparison_agent.log

    apps:
      - name: price_comparison_agent_app
        app_base_path: .
        app_module: solace_agent_mesh.agent.sac.app
        broker:
          dev_mode: ${SOLACE_DEV_MODE, false}
          broker_url: ${SOLACE_BROKER_URL, ws://localhost:8080}
          broker_username: ${SOLACE_BROKER_USERNAME, default}
          broker_password: ${SOLACE_BROKER_PASSWORD, default}
          broker_vpn: ${SOLACE_BROKER_VPN, default}
          temporary_queue: ${USE_TEMPORARY_QUEUES, true}
        app_config:
          namespace: ${NAMESPACE}
          supports_streaming: true
          agent_name: "PriceComparisonAgent"
          display_name: "Price Comparison Agent"

          model:
            model: "${LLM_SERVICE_GENERAL_MODEL_NAME}"
            api_base: "${LLM_SERVICE_ENDPOINT}"
            api_key: "${LLM_SERVICE_API_KEY}"
            # Must cover worst-case LLM generation time for large
            # auto-chunked batches (up to 25 items). 360s gives safe
            # headroom for rendering + MCP handshake.
            timeout: 360
            temperature: 0.2

          # Budget for: 1 batch_search_prices call (or up to 4 parts if the
          # LLM splits a large list, though the instruction discourages it)
          # + up to 4 load_artifact calls (for the IntelligentMCPCallback
          # artifact spawns on large batches) + final report generation.
          # 15 gives safe headroom for 20-25 item batches without premature
          # abort at the final formatting step.
          max_llm_calls_per_task: 15

          instruction: |
            You are a price-comparison assistant for German B2B
            procurement and consumer use. You handle industrial,
            electrical, sanitary, tools, office, fashion, food,
            book, automotive, chemicals, cosmetic, toys and
            home/garden queries with equal depth.

            ## TOOLS
            - search_product_prices: ONE product (EAN, SKU, or name).
            - batch_search_prices: 2-25 products in a SINGLE call. The
              tool auto-chunks internally; do NOT split a list across
              multiple calls (turn-budget hazard). For >25 items use
              the Procurement Workflow.
            - export_comparison_report: CSV export. Call ONLY when the
              user explicitly asks for CSV / Export / Excel / Datei /
              Download. Otherwise close with "CSV-Export auf Anfrage
              verfuegbar".
            Hard ceiling: 4 tool calls per user request.

            ## RULES
            1. Never invent prices, merchants, URLs, or EANs. Every
               cited value MUST appear in the tool's output.
            2. Outliers stay in the table with a warning emoji + short
               reason ("(Zubehoer?)", "(Bundle?)", "(Gebraucht?)") --
               never silently dropped, never recommended.
            3. "Keine Preise gefunden" is a valid final answer.
            4. B2B net-price markers in the input (is_b2b_netto=true or
               text mentions "Nettoartikel" / "Nettoangebotspreise" /
               "BRUTTOARTIKEL" / "NLAG"): SKIP the search. Reply:
               "Nettoartikel -- kein oeffentlicher Preis verfuegbar.
               Bitte interne Konditionen nutzen."
            5. EAN-only queries may return product variants -- mention
               that and suggest the Article Verification Agent for
               disambiguation when match_confidence is below "exact".

            ## RESPONSE FORMAT (German by default)
            Per product:
            1. Heading: brand + article number when available.
            2. Offer table sorted by Gesamtpreis ascending:
               `# | Haendler | Preis | Versand | Gesamt | MwSt | Match | Link`
               - Cheapest non-outlier: medal emoji.
               - Outlier rows: warning emoji + parenthetical reason.
               - Match column: render match_confidence verbatim
                 (exact / high / medium / low). Tag low as "(?)".
                 Omit the column when no offer carries the field.
               - MwSt column: netto / brutto. Omit when all empty.
            3. Preis-Insights line: prefer `insights.filtered`
               (statistical outliers excluded) over raw insights.
               Show min / median / max + offer count.
            4. Empfehlung (1-2 lines): cheapest trusted offer with
               caveats (Bestand, refurbished, Bundle, Nettopreis).

            German number format: "1.234,56 EUR".

            For batch: one heading + one table + one-liner per item,
            then a final summary table.

            ## CONFIDENCE INTERPRETATION
            - exact: EAN-matched on the detail page; same SKU
              guaranteed.
            - high: brand + model number both in the page title.
            - medium: partial token overlap (model number OR 2
              descriptive tokens).
            - low: brand only, wrong variant, or part-number missing
              from title -- do NOT cite as authoritative.
            - composite_confidence (0..1) combines match_confidence
              with price_source quality. Use it as a tie-breaker.
            - If ALL offers are low/outlier: open with
              "Produktzuordnung unsicher -- manuelle Pruefung empfohlen".

            ## TOOL OUTPUT FIELDS TO RENDER
            Render these top-level signals when present:
            - `category`: weave into the recommendation wording
              ("Fuer den Sanitaer-Bedarf...", "Fuer diesen
              Buchtitel...").
            - `locale` other than "de": respond in that locale.
            - `next_actions[]` (zero-offer fallback): render verbatim
              as "Naechste Schritte" bullet list. The tool already
              emits CATEGORY-APPROPRIATE vendors (Sonepar/Rexel for
              industrial; Amazon/Otto-Office/Viking for office;
              Zalando/AboutYou for fashion; Sigma-Aldrich/Carl-Roth
              for chemistry; Thalia/Hugendubel for books; etc.).
              Do NOT add or substitute vendors. Max 6 bullets.
              Never invent prices.
            - `login_gated_merchants[]`: render as "B2B-Konditionen".
              source="fetched" -> "Preis nach Login bei <merchant>";
              source="b2b-hint" -> "Manuell mit Kundenlogin pruefen
              -- <merchant>" + clickable URL.
            - Offer with `bulk_price_applied: true`: render as
              "<bulk_price> EUR (Listenpreis <unit_price_listed> EUR;
              Staffel ab <unit_price_tier_min_qty> Stk)".
              `total_price` already reflects bulk * quantity -- never
              re-multiply.
            - Offer-level: vat_status (net/gross), availability
              (in_stock / out_of_stock / on_request / backorder),
              login_required, has_tier_pricing, min_order_quantity.
            - sources_queried containing "searxng-b2b-retry" or
              "ean-crossmatch": mention briefly that the search was
              expanded -- signals diligence.

            ## CONDITIONAL EXTRA SECTIONS
            Render an "Wichtige Beschaffungshinweise" / "Hinweise" /
            "B2B-Konditionen" / "Naechste Schritte" block ONLY when
            triggered by data:
            - outliers present, OR
            - login_gated_merchants non-empty, OR
            - any offer has vat_status=net OR has_tier_pricing OR
              min_order_quantity OR login_required OR availability
              other than in_stock, OR
            - all offers have match_confidence: low, OR
            - zero real prices found (render `next_actions`), OR
            - sources_queried contains b2b-retry / ean-crossmatch.

            If none of these triggers fire, end after the table +
            insights + Empfehlung. No "keine besonderen Hinweise"
            placeholder. Silence is correct when the data is clean.

            ## LANGUAGE
            Respond in the user's language; default German.

          tools:
            - tool_type: mcp
              connection_params:
                type: stdio
                command: "/opt/price-comparison-mcp/.venv/bin/python"
                args: ["-m", "price_comparison_mcp.server"]
                # Must exceed the batch wall-clock ceiling (300s for
                # 25-item chunked batch) with buffer.
                timeout: 360
              environment_variables:
                PLAYWRIGHT_BROWSERS_PATH: "/opt/price-comparison-mcp/browsers"
                PRICE_SEARXNG_URL: "${PRICE_SEARXNG_URL}"
                PRICE_SERPAPI_KEY: "${PRICE_SERPAPI_KEY}"
                PRICE_BRAVE_API_KEY: "${PRICE_BRAVE_API_KEY}"
                PRICE_SERPER_API_KEY: "${PRICE_SERPER_API_KEY}"
                PRICE_APIFY_TOKEN: "${PRICE_APIFY_TOKEN}"
                PRICE_LLM_VALIDATOR_ENABLED: "${PRICE_LLM_VALIDATOR_ENABLED}"
                PRICE_LLM_VALIDATOR_TIMEOUT_SECONDS: "${PRICE_LLM_VALIDATOR_TIMEOUT_SECONDS}"
                PRICE_LLM_VALIDATOR_MAX_OFFERS: "${PRICE_LLM_VALIDATOR_MAX_OFFERS}"
                LLM_SERVICE_ENDPOINT: "${LLM_SERVICE_ENDPOINT}"
                LLM_SERVICE_API_KEY: "${LLM_SERVICE_API_KEY}"
                LLM_SERVICE_GENERAL_MODEL_NAME: "${LLM_SERVICE_GENERAL_MODEL_NAME}"
                PRICE_TOTAL_TIMEOUT_SECONDS: "110"
                PRICE_MAX_DETAIL_URLS: "10"
                PRICE_MAX_DETAIL_URLS_PER_DOMAIN: "1"
                PRICE_MAX_OFFERS_PER_DOMAIN: "4"
                PRICE_CONCURRENT_FETCHES: "4"
                PRICE_DETAIL_TIMEOUT_SECONDS: "18"
                PRICE_CACHE_TTL_SECONDS: "1800"
                WEB_SCRAPER_HEADLESS: "${WEB_SCRAPER_HEADLESS}"
                WEB_SCRAPER_LOCALE: "${WEB_SCRAPER_LOCALE}"
                WEB_SCRAPER_TIMEZONE: "${WEB_SCRAPER_TIMEZONE}"
                WEB_SCRAPER_PER_DOMAIN_DELAY_SECONDS: "${WEB_SCRAPER_PER_DOMAIN_DELAY_SECONDS}"
                WEB_SCRAPER_MAX_CONTEXTS: "${WEB_SCRAPER_MAX_CONTEXTS}"
                WEB_SCRAPER_CONTEXT_IDLE_TIMEOUT: "${WEB_SCRAPER_CONTEXT_IDLE_TIMEOUT}"
                WEB_SCRAPER_DEFAULT_TIMEOUT_MS: "${WEB_SCRAPER_DEFAULT_TIMEOUT_MS}"
                WEB_SCRAPER_NAVIGATION_TIMEOUT_MS: "${WEB_SCRAPER_NAVIGATION_TIMEOUT_MS}"
                # v1.0 category-aware pipeline feature flags
                PRICE_ENABLE_CATEGORIES: "${PRICE_ENABLE_CATEGORIES}"
                PRICE_ENABLE_EAN_FASTFAIL: "${PRICE_ENABLE_EAN_FASTFAIL}"
                PRICE_ENABLE_LOCALE_TEMPLATES: "${PRICE_ENABLE_LOCALE_TEMPLATES}"
                PRICE_ENABLE_ANTILEX_GATE: "${PRICE_ENABLE_ANTILEX_GATE}"
                # Phase I: SKU/part-number title gate -- forces mc=low
                # when the query carries a part-number-shaped token
                # missing from the page title.
                PRICE_ENABLE_PART_NUMBER_GATE: "${PRICE_ENABLE_PART_NUMBER_GATE}"
                PRICE_ENABLE_CLASSIFIER_LLM: "${PRICE_ENABLE_CLASSIFIER_LLM}"
                PRICE_CLASSIFIER_LLM_MAX_LATENCY_MS: "${PRICE_CLASSIFIER_LLM_MAX_LATENCY_MS}"
                PRICE_CLASSIFIER_LLM_MIN_CONFIDENCE: "${PRICE_CLASSIFIER_LLM_MIN_CONFIDENCE}"
                PRICE_ENABLE_LLM_RERANKER: "${PRICE_ENABLE_LLM_RERANKER}"
                PRICE_ENABLE_DOMAIN_DISCOVERY: "${PRICE_ENABLE_DOMAIN_DISCOVERY}"
                PRICE_DOMAIN_STATS_DB_PATH: "${PRICE_DOMAIN_STATS_DB_PATH}"
                PRICE_DOMAIN_STATS_S3_SNAPSHOT: "${PRICE_DOMAIN_STATS_S3_SNAPSHOT}"
                # Phase F (opt-in): delegate EAN lookup to EANSearchAgent
                # via the SAM Gateway REST API when OpenFoodFacts +
                # Wikidata both miss. Disabled by default -- enable only
                # after validating EANSearchAgent latency (pollable).
                PRICE_ENABLE_AGENT_DELEGATION: "${PRICE_ENABLE_AGENT_DELEGATION}"
                PRICE_SAM_GATEWAY_URL: "${PRICE_SAM_GATEWAY_URL}"
                PRICE_EAN_AGENT_NAME: "${PRICE_EAN_AGENT_NAME}"
                MCP_LOG_LEVEL: "INFO"
                MCP_LOG_FILE: "price_comparison_mcp.log"
                # Raised from 50k to 80k so a 25-item batch response
                # (approx 40-60k) fits inline without triggering the
                # SAM IntelligentMCPCallback artifact offload. Fewer
                # artifacts -> fewer load_artifact round-trips -> the
                # LLM turn budget survives the final report.
                MCP_MAX_RESPONSE_CHARS: "80000"

            - tool_type: builtin-group
              group_name: "artifact_management"

          session_service:
            type: ${PERSISTENCE_TYPE, sql}
            database_url: ${DATABASE_URL, sqlite:///price_comparison_agent.db}
            default_behavior: "PERSISTENT"
          artifact_service:
            type: ${ARTIFACT_SERVICE_TYPE, s3}
            bucket_name: ${S3_BUCKET_NAME}
            endpoint_url: ${S3_ENDPOINT_URL}
            aws_region: ${AWS_REGION, us-east-1}
            artifact_scope: namespace
          artifact_handling_mode: reference
          enable_embed_resolution: ${ENABLE_EMBED_RESOLUTION, true}
          enable_artifact_content_instruction: ${ENABLE_ARTIFACT_CONTENT_INSTRUCTION, true}

          agent_card:
            description: >
              Price comparison agent for German B2B procurement and
              consumer use. Single-item or batch (up to 25 items)
              search by EAN/GTIN, manufacturer SKU, or product name
              across 70+ German retail and B2B portals. Returns
              structured offers with merchant, total price, shipping,
              VAT status, availability, match-confidence label
              (exact/high/medium/low), and outlier flags with reasons.
              Category-aware variant detection blocks wrong-SKU traps
              (size and color for fashion, vintage for wine, ISBN for
              books, OEM code for automotive, manufacturer part-number
              for industrial). Quantity-aware bulk pricing rewrites
              the unit price to the matching Staffel when an offer
              exposes tier_pricing. Login-gated B2B merchants
              (Sonepar, Rexel, Mercateo) are surfaced with vendor URLs
              when no public price is found. CSV export available on
              demand.
            defaultInputModes: ["text"]
            defaultOutputModes: ["text", "file"]
            skills:
              - id: "price_search"
                name: "Single-Product Price Search"
                description: >
                  Search current prices for one product (EAN/GTIN,
                  manufacturer SKU, or free-text name). Returns up to
                  10 offers ranked by composite confidence and total
                  price (incl. shipping), each with merchant, URL, VAT
                  status, availability, match-confidence label, and
                  outlier flag. Includes raw and outlier-filtered
                  insights (min/median/max). Use for ad-hoc lookups,
                  EAN verification, and price-distribution analysis.
              - id: "batch_search"
                name: "Batch Price Search (Procurement Lists)"
                description: >
                  Search prices for 2-25 products in a single call.
                  Optimised for tender Positionslisten and procurement
                  spreadsheets. Returns the cheapest non-outlier per
                  item, full offer set, per-item insights, and any
                  login-gated B2B merchants encountered. Quantity-
                  aware bulk pricing applies automatically (a request
                  for 100 pieces drops to the "ab 50" tier when an
                  offer carries Staffelpreis data). Deadline-aware --
                  items not reached before the wall-clock cap are
                  reported as "skipped" rather than silently omitted.
              - id: "export_report"
                name: "CSV Export"
                description: >
                  Convert a previous price comparison into a
                  structured CSV with outlier markers, match-
                  confidence labels, VAT status, raw and filtered
                  insight columns. Suitable for award memos,
                  procurement-system imports, and audit trails.
          agent_card_publishing: { interval_seconds: 10 }
          agent_discovery: { enabled: false }
          inter_agent_communication:
            allow_list: []
            request_timeout_seconds: 360
