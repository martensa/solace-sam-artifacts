apiVersion: apps/v1
kind: Deployment
metadata:
  name: sam-price-comparison-agent
  namespace: sam-solace-lab-agents
  labels:
    app: sam-external-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sam-external-agents
  template:
    metadata:
      labels:
        app: sam-external-agents
    spec:
      containers:
      - name: sam-price-comparison-agent
        # :latest always pulled fresh on pod start (imagePullPolicy: Always).
        # Version bumps via `make release VERSION=x.y.z` retag :latest to the
        # new digest and trigger a rollout. Current tag is visible via
        # `make verify-version` (reads the server startup log line).
        image: registry.solace.lab/sam-price-comparison-agent:latest
        imagePullPolicy: Always
        workingDir: /app
        command: ["solace-agent-mesh", "run"]
        args:
        - "configs/agents/price_comparison_agent.yaml"
        envFrom:
        # Shared values (LLM, Solace, S3); agent-specific secret overrides
        - secretRef:
            name: sam-shared-secret
        - secretRef:
            name: sam-price-comparison-agent-secret
        volumeMounts:
        - name: config-volume
          mountPath: /app/configs
        - name: dshm
          mountPath: /dev/shm
        # v1.0 beta1: dynamic domain-discovery SQLite + classifier cache.
        # emptyDir for now -- state resets on pod restart but learns during
        # a pod's lifetime. v1.1 can upgrade to a PV or S3 snapshot.
        - name: pc-data
          mountPath: /app/data
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
      volumes:
      - name: config-volume
        configMap:
          name: sam-price-comparison-agent-config
          items:
          - key: price_comparison_agent.yaml
            path: agents/price_comparison_agent.yaml
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
      - name: pc-data
        emptyDir:
          sizeLimit: 256Mi
      imagePullSecrets:
      - name: localhost-registry
