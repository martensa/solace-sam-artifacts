apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: sam-solace-lab-shared
data:
  settings.yml: |
    use_default_settings: true

    general:
      instance_name: "SAM SearXNG"
      debug: false

    server:
      port: 8080
      bind_address: "0.0.0.0"
      secret_key: "sam-searxng-secret-key-change-in-prod"
      # Disable rate limiting for internal use
      limiter: false

    search:
      safe_search: 0
      default_lang: "de"
      formats:
        - html
        - json

    categories_as_tabs:
      general:
      shopping:
      images:
      news:

    # Enable the engines most relevant for B2B product search
    engines:
      # -- General web search engines ---------------------------------
      # Google - primary, best quality
      - name: google
        engine: google
        shortcut: g
        disabled: false
        weight: 1.2

      # Bing - good secondary
      - name: bing
        engine: bing
        shortcut: b
        disabled: false
        weight: 1.0

      # DuckDuckGo - fallback
      - name: duckduckgo
        engine: duckduckgo
        shortcut: ddg
        disabled: false
        weight: 0.8

      # Google (German) - for B2B electrical products
      - name: google de
        engine: google
        shortcut: gde
        disabled: false
        use_mobile_ui: false
        language: de
        weight: 1.1

      # Mojeek - independent index, good long-tail DE shop coverage.
      # Added for 1.0.0 final quality push (reduces single-point Google
      # dependency for long-tail B2B queries).
      - name: mojeek
        engine: mojeek
        shortcut: mjk
        disabled: false
        weight: 0.9
        timeout: 6.0

      # Startpage - Google-proxy with robust anti-bot bypass, useful
      # when Google starts CAPTCHA-gating our cluster IP.
      - name: startpage
        engine: startpage
        shortcut: sp
        disabled: false
        weight: 1.0
        timeout: 8.0

      # Qwant - EU-focused index, strong for DE/FR shops.
      - name: qwant
        engine: qwant
        shortcut: qw
        disabled: false
        weight: 0.8
        timeout: 6.0

      # Yandex - disabled by default (CAPTCHAs from DE egress IPs);
      # flip to false once a proxy is available for the cluster.
      - name: yandex
        engine: yandex
        shortcut: yx
        disabled: true
        weight: 0.7
        timeout: 6.0

      # -- Shopping engines (primary source for price comparison) -----
      # Google Shopping - structured product tiles including sponsored
      - name: google shopping
        engine: google_shopping
        shortcut: gs
        categories:
          - shopping
        disabled: false
        weight: 1.5
        timeout: 8.0

      # Amazon - broad consumer + B2B coverage
      - name: amazon
        engine: amazon
        shortcut: amz
        categories:
          - shopping
        disabled: false
        weight: 1.0
        timeout: 8.0

      # eBay - secondary consumer marketplace
      - name: ebay
        engine: ebay
        shortcut: eb
        categories:
          - shopping
        disabled: false
        weight: 0.8
        timeout: 8.0

    outgoing:
      # Connection pool for upstream search engines
      request_timeout: 8
      max_request_timeout: 15
      pool_connections: 100
      pool_maxsize: 20
